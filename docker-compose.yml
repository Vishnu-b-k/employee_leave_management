services:
  postgres:
    image: postgres:16-alpine
    container_name: leave_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-leave_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-leave_management}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - leave-net

  prisma-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: leave_prisma_migrate
    restart: "no"
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-leave_management}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leave-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-leave_management}?schema=public
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - leave-net

networks:
  leave-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
